<div class="container mt-4">
	<div class="grid">
		<div class="col-12 md:col-6 lg:col-3">
			<div class="surface-card shadow-1 p-3 border-round h-full flex flex-column justify-content-between">
				<div>
					<div class="flex justify-content-between mb-3">
						<div>
							<span class="block text-500 font-medium mb-2">Total Users</span>
							<div class="text-900 font-bold text-2xl">{{ totalRecords }}</div>
						</div>
						<div class="flex align-items-center justify-content-center bg-blue-100 border-round w-3rem h-3rem">
							<i class="pi pi-users text-blue-500 text-xl"></i>
						</div>
					</div>
				</div>
				<div class="flex align-items-center gap-1 text-sm">
					<span class="text-green-500 font-semibold">+12%</span>
					<span class="text-500">since last week</span>
				</div>
			</div>
		</div>

		<div class="col-12 md:col-6 lg:col-3">
			<div class="surface-card shadow-1 p-3 border-round h-full flex flex-column justify-content-between">
				<div>
					<div class="flex justify-content-between mb-3">
						<div>
							<span class="block text-500 font-medium mb-2">Active Sessions</span>
							<div class="text-900 font-bold text-2xl">1,240</div>
						</div>
						<div class="flex align-items-center justify-content-center bg-orange-100 border-round w-3rem h-3rem">
							<i class="pi pi-bolt text-orange-500 text-xl"></i>
						</div>
					</div>
				</div>
				<div class="flex align-items-center gap-1 text-sm">
					<span class="text-green-500 font-semibold">+52%</span>
					<span class="text-500">since yesterday</span>
				</div>
			</div>
		</div>

		<div class="col-12 md:col-6 lg:col-3">
			<div class="surface-card shadow-1 p-3 border-round h-full flex flex-column justify-content-between">
				<div>
					<div class="flex justify-content-between mb-3">
						<div>
							<span class="block text-500 font-medium mb-2">Pending Requests</span>
							<div class="text-900 font-bold text-2xl">15</div>
						</div>
						<div class="flex align-items-center justify-content-center bg-cyan-100 border-round w-3rem h-3rem">
							<i class="pi pi-inbox text-cyan-500 text-xl"></i>
						</div>
					</div>
				</div>
				<div class="flex align-items-center gap-1 text-sm">
					<span class="text-orange-500 font-semibold"><i class="pi pi-exclamation-circle text-xs"></i></span>
					<span class="text-500">Requires review</span>
				</div>
			</div>
		</div>

		<div class="col-12 md:col-6 lg:col-3">
			<div class="surface-card shadow-1 p-3 border-round h-full flex flex-column justify-content-between">
				<div>
					<div class="flex justify-content-between mb-3">
						<div>
							<span class="block text-500 font-medium mb-2">System Status</span>
							<div class="text-green-500 font-bold text-2xl">Healthy</div>
						</div>
						<div class="flex align-items-center justify-content-center bg-purple-100 border-round w-3rem h-3rem">
							<i class="pi pi-server text-purple-500 text-xl"></i>
						</div>
					</div>
				</div>
				<div class="flex align-items-center gap-1 text-sm">
					<span class="text-green-500 font-semibold"><i class="pi pi-check-circle text-xs"></i></span>
					<span class="text-500">All services operational</span>
				</div>
			</div>
		</div>
	</div>

	<app-table [title]="title" [columns]="columns" [data]="data" [totalRecords]="totalRecords" [loading]="loading"
		[statusOptions]="statusOptions" addLabel="Add User" (add)="onAdd()" (action)="onRowAction($event)"
		(deleteSelected)="onDeleteSelected($event)" (lazyLoad)="fetchUsers($event)">
	</app-table>
</div>
